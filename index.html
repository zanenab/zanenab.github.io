<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Now</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@4.5.2/dist/minty/bootstrap.min.css" rel="stylesheet">
    <!-- Bootswatch -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"> -->
</head>
<body class="bg-dark">
    <div class="d-flex justify-content-center align-items-center vh-100">

        <div class="card col-12 col-lg-4 mt-3 mb-2">
            <div class="card-header">
                Weather
            </div>

            <div class="card-body">
                <p id="parTemperature">Temperature</p>
                <p id="parHumidity">Humidity</p>
                <p id="parPercipitation">Percipitation</p>
            </div>

            <footer class="card-footer text-body-secondary">
                The weather data is provided by <a href="https://open-meteo.com/">Open-Meteo</a> weather api. For more information see their website.
            </footer>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const strWeatherAPIUrl = 'https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,showers,snowfall,weather_code,cloud_cover&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&forecast_days=1';

        const dctWeatherCodes = {
            0: "Clear sky",
            1: "Mainly clear", 
            2: "partly cloudy", 
            3: "overcast",
            45: "Fog", 
            48: "depositing rime fog",
            51: "Light Drizzle", 
            53: "moderate Drizzle",
            55: "dense Drizzle",
            56: "Freezing Drizzle Light",
            57: "Freezing Drizzle dense",
            61: "Rain: Slight",
            63: "Rain: moderate",
            65: "Rain: heavy intensity",
            66: "Freezing Rain Light ",
            67: "Freezing Rain heavy",
            71: "Snow fall: Slight",
            73: "Snow fall: moderate",
            75: "Snow fall: heavy",
            77:	"Snow grains",
            80: "rain showers Slight",
            81: "rain showers moderate",
            82: "rain showers violent",
            85: "Snow showers slight ",
            86: "Snow showers heavy",
            95: "Thunderstorm: Slight or moderate",
            96: "Thunderstorm with slight",
            99: "Thunderstorm with heavy hail",
        }
        const dctWeatherCodeIcons = {
            0: '<i class="bi bi-sun-fill"></i>',
            1: '<i class="bi bi-cloud-sun-fill"></i>', 
            2: '<i class="bi bi-cloud-sun-fill"></i>', 
            3: '<i class="bi bi-cloud-fill"></i>',
            45: '<i class="bi bi-cloud-fog-fill"></i>', 
            48: '<i class="bi bi-cloud-fog-fill"></i>',
            51: '<i class="bi bi-cloud-drizzle-fill"></i>', 
            53: '<i class="bi bi-cloud-drizzle-fill"></i>',
            55: '<i class="bi bi-cloud-drizzle-fill"></i>',
            56: '<i class="bi bi-cloud-drizzle-fill"></i>',
            57: '<i class="bi bi-cloud-drizzle-fill"></i>',
            61: '<i class="bi bi-cloud-rain-fill"></i>',
            63: '<i class="bi bi-cloud-rain-fill"></i>',
            65: '<i class="bi bi-cloud-rain-fill"></i>',
            66: '<i class="bi bi-cloud-rain-fill"></i>',
            67: '<i class="bi bi-cloud-rain-fill"></i>',
            71: '<i class="bi bi-cloud-snow-fill"></i>',
            73: '<i class="bi bi-cloud-snow-fill"></i>',
            75: '<i class="bi bi-cloud-snow-fill"></i>',
            77:	'<i class="bi bi-cloud-snow-fill"></i>',
            80: '<i class="bi bi-cloud-rain-heavy-fill"></i>',
            81: '<i class="bi bi-cloud-rain-heavy-fill"></i>',
            82: '<i class="bi bi-cloud-rain-heavy-fill"></i>',
            85: '<i class="bi bi-cloud-snow-fill"></i>',
            86: '<i class="bi bi-cloud-snow-fill"></i>',
            95: '<i class="bi bi-cloud-lightning-rain-fill"></i>',
            96: '<i class="bi bi-cloud-lightning-rain-fill"></i>',
            99: '<i class="bi bi-cloud-lightning-rain-fill"></i>',
        }


        async function getWeather() {
            try { // This is a response, not data. Need the await to avoid a race condition.
                const objResponse =  await fetch(strWeatherAPIUrl)
                if (!objResponse.ok) {
                    throw new Error(`HTTP Error Status: ${objResponse.status}`);
                }
                const objData = await objResponse.json();
                console.log(objData);

                document.getElementById('#')
                document.querySelector("#parTemperature").innerHTML = `Temperature: ${objData.current.temperature_2m} ${objData.current_units.temperature_2m}`
                document.querySelector("#parHumidity").innerHTML = `Temperature: ${objData.current.relative_humidity_2m}  ${objData.current_units.relative_humidity_2m}`
                document.querySelector("#parPercipitation").innerHTML = dctWeatherCodes[objData.current.weather_code] + "  " + dctWeatherCodeIcons[objData.current.weather_code]

            } catch (objError) {
                console.log('Error fetching objData', objError);
            }
        }


        getWeather();

    </script>
</body>
</html>
