                <h1>

                </h1>
            </header>

            <div class="card-body">
                <div class="row">

                    <div class="col-12 col-md-6">
                        <div class="form-floating mb-3">

                        <div class="form-floating mb-3">
                            <input id="numLongitude" class="form-control mt-2" type="number" placeholder="Longitude" aria-label="Number input for longitude." value="-85.50" required>

                    <!-- Right side of the card -->
                    <div class="col-12 col-md-6 mt-3">
                        <div class="row">
                            <div class="col-8" style="max-width: 50%; max-height: 50%;">

                            </div>

                            </div>

                            </div>
                            <div class="col-12">
                                <p id="parHumidity">Humidity: ...</p>
                            </div>
                        </div>

                    </div>
                </div>

        async function getWeather(strUserLatitude, strUserLongitude) {
            // This is a response, not data. Need the await to avoid a race condition.
            try { 
                const objResponse =  await fetch(`${strBaseWeatherUrl}?latitude=${strUserLatitude}&longitude=${strUserLongitude}&${strRequestedData}&${strUnitArguments}`)
                if (!objResponse.ok) {
                    throw new Error(`HTTP Error Status: ${objResponse.status}`);
                }
                const objData = await objResponse.json();
                console.log(objData);

                document.getElementById('#')
                document.querySelector("#parTemperature").innerHTML = `Temperature: ${objData.current.temperature_2m} ${objData.current_units.temperature_2m}`
                document.querySelector("#parHumidity").innerHTML = `Humidity: ${objData.current.relative_humidity_2m} ${objData.current_units.relative_humidity_2m}`
                document.querySelector("#parPercipitation").innerHTML = dctWeatherCodes[objData.current.weather_code]
                document.querySelector("#parPercipitationIcon").innerHTML = dctWeatherCodeIcons[objData.current.weather_code]

            } catch (objError) {
                console.log('Error fetching objData', objError);
            }
        }


        document.querySelector("#btnGetWeather").addEventListener("click", (e) => {
            let strLatitude = document.querySelector('#numLatitude').value.trim()
            let strLongitude = document.querySelector('#numLongitude').value.trim()

            let blnError = false;
            let strErrorMsg = '';

            if (!regLat.test(strLatitude)) {
                blnError = true;
                strErrorMsg += '<p>The latitude is in the wrong format or missing.</p>'
            }
            if (!regLong.test(strLongitude)) {
                blnError = true;
                strErrorMsg += '<p>The latitude is in the wrong format or missing.</p>'
            }

            if (blnError === true){
                    Swal.fire({
                        title: "Oh no, you have an error!",
                        html: strErrorMsg,
                        icon: "error"
                    });
            }
            else {
                getWeather(strLatitude, strLongitude);
            }
        });

    </script>
