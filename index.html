<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" class="dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>Weather Now</title>

    <meta name="mobile-web-app-capable" content="yes">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="apple-touch-startup-image" href="images/cloud.png">
    <link rel="apple-touch-icon" href="images/cloud.png">
    <link rel="apple-touch-icon" sizes="57x57" href="images/cloud57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="images/cloud60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="images/cloud72x72.png">
    <link rel="apple-touch-icon" sizes="114x114" href="images/cloud114x114.png">
    <link rel="apple-touch-icon" sizes="144x144" href="images/cloud144x144.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/cloud180x180.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Data Tables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/2.2.2/css/dataTables.dataTables.min.css">
</head>

<body style="background: linear-gradient(to bottom right, rgb(142, 206, 209) 0%, rgb(54, 97, 124) 100%); height: 100%; margin: 0; background-repeat: no-repeat; background-attachment: fixed;">
    <div class="d-flex flex-column justify-content-center align-items-center vh-100">

        <div class="col-10 row">

            <!-- Left/top of page -->
            <div class="col-12 col-md-6">
                <h1 class="col-12 text-center mt-3 pb-0"> <i id="divPercipitationIcon" class="bi bi-cloud-lightning-fill" style="font-size: 130px !important;"></i> </h1>
                <h2 id="divPercipitation" class="col-12 text-center pb-2 text-white" style="font-size: 45px;"> </h2>
                <h3 id="divTemperature" class="col-12 text-center text-white"style="font-size: 40px;"> </h3>
                <h3 id="divHumidity" class="col-12 text-center text-white"style="font-size: 40px;"> </h3>
            </div>

            <!-- Right/bottom of page -->
            <div class="col-12 col-md-6 mt-0">
                <h1 class="text-center mb-0"> 7 Day Forcast </h1>
                <div class="overflow-auto mt-0">
                    <table id="tblDailyWeather" class="table-info  text-white compact display mt-0" aria-label="Table showing weather information for the next 7 days">
                        <thead>
                            <tr>
                                <th></th> <th>Date</th> <th>Temp High</th> <th>Temp Low</th> <th>Sun Rise</th> <th>Sun Set</th> <th>Rain</th>
                            </tr>
                        </thead>
                        <tbody id="tblDailyWeatherData"> </tbody>
                    </table>
                </div>
            </div>

        </div>

        <footer class="">
            Weather data provided by <a href="https://open-meteo.com/">Open-Meteo</a>.
        </footer>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Sweetalerts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- For Data Tables -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/2.2.2/js/dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/responsive/3.0.4/js/dataTables.responsive.js"></script>
    <script src="https://cdn.datatables.net/responsive/3.0.4/js/responsive.dataTables.js"></script>

    <script>
        // Determine if you can get the GPS location of the device being used
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    let latitude = position.coords.latitude;
                    let longitude = position.coords.longitude;
                    getWeather(latitude,longitude)
                },
                (error) => {
                    Swal.fire({
                        title: "Oh no, you have an error!",
                        html: "Location features must be enabled to retrieve weather informartion",
                        icon: "error"
                    });
                    console.error("Error getting location:", error.message);
                }
            );
        } else {
            console.error("Geolocation is not supported by this browser.");
        }

        // API parameters
        const strBaseWeatherUrl = 'https://api.open-meteo.com/v1/forecast';
        const strRequestedData = 'current=temperature_2m,relative_humidity_2m,weather_code';
        const strHourly        = 'hourly=temperature_2m,relative_humidity_2m,precipitation_probability,rain,weather_code';
        const strDaily         = 'daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,daylight_duration,precipitation_sum,rain_sum';
        const strUnitArguments = 'temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America%2FChicago&temporal_resolution=hourly_3';

        // Convert weather codes to conditions and icons.
        const dctWeatherCodeConditions = {
            0: "Clear Sky",
            1: "Mainly Clear", 
            2: "Partly Cloudy", 
            3: "Overcast",
            45: "Fog", 
            48: "Depositing Rime Fog",
            51: "Light Drizzle", 
            53: "Moderate Drizzle",
            55: "Dense Drizzle",
            56: "Freezing Drizzle Light",
            57: "Freezing Drizzle Dense",
            61: "Slight Rain",
            63: "Moderate Rain",
            65: "Heavy Rain",
            66: "Freezing Rain Light",
            67: "Freezing Rain heavy",
            71: "Slight Snow Fall",
            73: "Moderate Snow Fall",
            75: "Heavy Snow Fall",
            77:	"Snow Grains",
            80: "Slight Rain Showers",
            81: "Moderate Rain Showers",
            82: "Violent Rain Showers",
            85: "Slight Snow Showers",
            86: "Heavy Snow Showers",
            95: "Thunderstorm",
            96: "Thunderstorm With Slight Hail",
            99: "Thunderstorm With Heavy Hail",
        }
        const dctWeatherCodeIconsClasses = {
            0:  "bi-sun-fill",
            1:  "bi-cloud-sun-fill",
            2:  "bi-cloud-sun-fill",
            3:  "bi-cloud-fill",
            45: "bi-cloud-fog-fill",
            48: "bi-cloud-fog-fill",
            51: "bi-cloud-drizzle-fill",
            53: "bi-cloud-drizzle-fill",
            55: "bi-cloud-drizzle-fill",
            56: "bi-cloud-drizzle-fill",
            57: "bi-cloud-drizzle-fill",
            61: "bi-cloud-rain-fill",
            63: "bi-cloud-rain-fill",
            65: "bi-cloud-rain-fill",
            66: "bi-cloud-rain-fill",
            67: "bi-cloud-rain-fill",
            71: "bi-cloud-snow-fill",
            73: "bi-cloud-snow-fill",
            75: "bi-cloud-snow-fill",
            77:	"bi-cloud-snow-fill",
            80: "bi-cloud-rain-heavy-fill",
            81: "bi-cloud-rain-heavy-fill",
            82: "bi-cloud-rain-heavy-fill",
            85: "bi-cloud-snow-fill",
            86: "bi-cloud-snow-fill",
            95: "bi-cloud-lightning-fill",
            96: "bi-cloud-lightning-fill",
            99: "bi-cloud-lightning-fill"
        }

        // Create new data table for 7 day forcast
        let table = new DataTable('#tblDailyWeather', {
            info: false,
            ordering: false,
            searching: false,
            paging: false,
            responsive: true
        });

        // Call the weather api and populate the dynamic features.
        async function getWeather(strUserLatitude, strUserLongitude) {
            // This is a response, not data. Need the await to avoid a race condition.
            try { 
                const objResponse =  await fetch(`${strBaseWeatherUrl}?latitude=${strUserLatitude}&longitude=${strUserLongitude}&${strRequestedData}&${strHourly}&${strDaily}&${strUnitArguments}`)
                if (!objResponse.ok) {
                    throw new Error(`HTTP Error Status: ${objResponse.status}`);
                }
                const objData = await objResponse.json();

                // Set the weather icon, temperature, and humidity
                document.querySelector("#divPercipitationIcon").className = `bi ${dctWeatherCodeIconsClasses[objData.current.weather_code]}`
                document.querySelector("#divPercipitation").innerHTML = `${dctWeatherCodeConditions[objData.current.weather_code]}`
                document.querySelector("#divTemperature").innerHTML = `<i class="bi bi-thermometer-half me-2"></i>${objData.current.temperature_2m} ${objData.current_units.temperature_2m}`
                document.querySelector("#divHumidity").innerHTML = `<i class="bi bi-droplet me-2"></i>${objData.current.relative_humidity_2m} ${objData.current_units.relative_humidity_2m}`

                // Add 7 day forcast to the table
                let dataString = "";
                for (let i = 0; i < objData.daily.time.length; i++){
                    dataString += `<tr> 
                        <td> <i class="bi ${dctWeatherCodeIconsClasses[objData.current.weather_code]}" aria-label="Icon showing the weather conditions can be described as ${dctWeatherCodeConditions[objData.current.weather_code]}."></i></td>  
                        <td>${objData.daily.time[i]}</td> 
                        <td>${objData.daily.temperature_2m_max[i]} ${objData.daily_units.temperature_2m_max}</td> 
                        <td>${objData.daily.temperature_2m_min[i]} ${objData.daily_units.temperature_2m_min}</td> 
                        <td>${objData.daily.sunrise[i].slice(11)}</td> 
                        <td>${objData.daily.sunset[i].slice(11)}</td> 
                        <td>${objData.daily.precipitation_sum[i]} ${objData.daily_units.precipitation_sum}</td> 
                    </tr> `
                }

                document.querySelector('#tblDailyWeatherData').innerHTML = dataString;
            } catch (objError) {
                console.log('Error fetching objData', objError);
            }
        }

    </script>
</body>
</html>
